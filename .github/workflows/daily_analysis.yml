name: Porter Daily Analytics

on:
  schedule:
    # Run daily at 5:30 AM UTC (11:00 AM IST)
    - cron: '30 5 * * *'
  workflow_dispatch: {}
  push:
    branches: [ main ]

jobs:
  run-analytics:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Run Porter Analytics Agent
      env:
        # Load secrets from GitHub Repository Secrets
        EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
        EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        IMAP_SERVER: ${{ secrets.IMAP_SERVER || 'imap.gmail.com' }}
        IMAP_PORT: ${{ secrets.IMAP_PORT || '993' }}
        SMTP_SERVER: ${{ secrets.SMTP_SERVER || 'smtp.gmail.com' }}
        SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
        EMAIL_SENDER_FILTER: ${{ secrets.EMAIL_SENDER_FILTER || 'datareports@theporter.in' }}
        EMAIL_SUBJECT_FILTER: ${{ secrets.EMAIL_SUBJECT_FILTER || '3W - EV daily report' }}
        REPORT_TO: ${{ secrets.REPORT_TO }}
        # Default config values
        ONLY_UNREAD: 'false'
        MARK_AS_READ: 'true'
        MIN_ORDERS_THRESHOLD: '5'
        GOP_CREDENTIALS_JSON: ${{ secrets.GOP_CREDENTIALS_JSON }}
        GOP_TOKEN_JSON: ${{ secrets.GOP_TOKEN_JSON }}
      run: |
        mkdir -p config
        cat << 'EOF' > config/.env
        EMAIL_ADDRESS=${EMAIL_ADDRESS}
        EMAIL_PASSWORD=${EMAIL_PASSWORD:-oauth2}
        IMAP_SERVER=${IMAP_SERVER:-imap.gmail.com}
        IMAP_PORT=${IMAP_PORT:-993}
        SMTP_SERVER=${SMTP_SERVER:-smtp.gmail.com}
        SMTP_PORT=${SMTP_PORT:-587}
        EMAIL_SENDER_FILTER=${EMAIL_SENDER_FILTER:-datareports@theporter.in}
        EMAIL_SUBJECT_FILTER=${EMAIL_SUBJECT_FILTER:-3W - EV daily report}
        REPORT_TO=${REPORT_TO}
        ONLY_UNREAD=${ONLY_UNREAD:-false}
        MARK_AS_READ=${MARK_AS_READ:-true}
        MIN_ORDERS_THRESHOLD=${MIN_ORDERS_THRESHOLD:-5}
        EOF

        # Reconstitute OAuth2 files if secrets are available
        if [ -n "$GOP_CREDENTIALS_JSON" ]; then
          echo "$GOP_CREDENTIALS_JSON" > credentials.json
          echo "Created credentials.json from secret"
        fi
        if [ -n "$GOP_TOKEN_JSON" ]; then
          echo "$GOP_TOKEN_JSON" > token.json
          echo "Created token.json from secret"
        fi
        
        python main.py

    - name: Archive artifacts (Optional)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: execution-logs
        path: |
          porter_analytics.log
          data/reports/*.html
        retention-days: 5
